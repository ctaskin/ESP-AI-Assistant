<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ceko · Yüz önizlemesi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10171c;color:#dfeaf0;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.wrap{text-align:center;padding:28px 12px}h1{font-size:22px;font-weight:500;letter-spacing:4px}p{color:#8b9ca6;font-size:14px;max-width:480px;line-height:1.6}.face{width:min(78vw,466px);aspect-ratio:1;border-radius:50%;background:#000;box-shadow:0 0 0 8px #253039,0 20px 90px #0009;margin:35px auto}svg{width:100%;height:100%;overflow:hidden;border-radius:50%}button{border:1px solid #354550;border-radius:24px;padding:10px 15px;color:#c9dbe6;background:transparent;cursor:pointer;margin:4px}button[aria-pressed=true]{background:#75e5ff;color:#00161b;border-color:#75e5ff}button:focus-visible{outline:3px solid white;outline-offset:3px}.hint{font-size:12px;color:#617681}
</style><div class="wrap"><h1>CEKO</h1><p>İki göz. Küçük bir ses. Masanda bir arkadaş.</p>
<div class="face"><svg viewBox="0 0 466 466" aria-label="Ceko'nun animasyonlu yüzü" role="img"><rect width="466" height="466" fill="black"/><circle id="dot" cx="233" cy="100" r="4"/><rect id="left"/><rect id="right"/><rect id="mouth"/><text id="caption" x="233" y="378" text-anchor="middle" font-family="system-ui" font-size="16" fill="#637785">hey ceko</text></svg></div>
<nav aria-label="Yüz durumları"><button data-state="idle" aria-pressed="true">Bekliyor</button><button data-state="listen" aria-pressed="false">Dinliyor</button><button data-state="think" aria-pressed="false">Düşünüyor</button><button data-state="speak" aria-pressed="false">Konuşuyor</button></nav>
<p class="hint">Görsel demo · Mikrofon veya API kullanmaz.<br>Bu önizlemede ağız hareketi simüledir; cihazda çalınan sesin şiddetini izler.</p></div>
<script>
let state='idle',nextBlink=3000,blinkStart=null,level=0;const el=id=>document.getElementById(id);const captions={idle:'hey ceko',listen:'Dinliyorum',think:'Dusunuyorum',speak:'Ceko'};
for(const b of document.querySelectorAll('button'))b.onclick=()=>{state=b.dataset.state;for(const x of document.querySelectorAll('button'))x.setAttribute('aria-pressed',String(x===b));el('caption').textContent=captions[state]};
function rect(id,x,y,w,h,color){const n=el(id);for(const [k,v]of Object.entries({x,y,width:w,height:h,rx:Math.min(w,h)/2,fill:color}))n.setAttribute(k,v)}
function frame(now){let open=1;if(blinkStart===null&&now>=nextBlink)blinkStart=now;if(blinkStart!==null){const age=now-blinkStart;if(age<90)open=1-age/90;else if(age<140)open=0;else if(age<260)open=(age-140)/120;else{blinkStart=null;nextBlink=now+2600+Math.random()*4000}}
const eh=state==='think'?66:state==='listen'?116:100,h=8+(eh-8)*open,x=Math.sin(now/2700)*7,y=Math.sin(now/1900)*4,col=state==='listen'?'#91ffcc':'#75e5ff';rect('left',115+x,200-h/2+y,82,h,col);rect('right',269+x,200-h/2+y,82,h,col);
let target=state==='speak'?Math.max(0,Math.sin(now/113)*.28+Math.sin(now/59)*.15+.35)*(Math.sin(now/620)>.1?1:0):0;level+=(target-level)*(target>level?.65:.35);const mh=8+level*62,mw=62+level*26;rect('mouth',233-mw/2,296-mh/2,mw,mh,col);el('dot').setAttribute('fill',col);el('dot').setAttribute('opacity',state==='think'?.35+.31*(1+Math.sin(now/250)):.7);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
